<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ECN Tutor - Imageur Médical</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: var(--tg-theme-bg-color, #000);
            color: var(--tg-theme-text-color, #fff);
            overflow: hidden;
            touch-action: none; /* Prevent pull-to-refresh */
        }
        #viewer-container {
            width: 100%;
            height: calc(100dvh - 120px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #111;
            overflow: hidden;
        }
        #med-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
        /* Loading spinner */
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            position: absolute;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hud {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col">

    <!-- Header -->
    <div class="h-16 flex items-center justify-between px-4 bg-gray-900 border-b border-gray-800">
        <select id="case-select" class="bg-gray-800 text-white rounded p-2 text-sm border-none outline-none">
            <option value="neuro_case1">Neuro: IRM Cérébrale (T1 Axial)</option>
            <option value="ortho_case1" disabled>Ortho: Scanner Rachis (Bientôt)</option>
            <option value="anesth_case1" disabled>Anesth: Écho Plexus (Bientôt)</option>
        </select>
    </div>

    <!-- Viewer -->
    <div id="viewer-container">
        <div id="loading" class="loader"></div>
        <img id="med-image" style="display: none;" />
        
        <div class="hud" id="hud-info">
            Coupe: 0/0<br>
            Épaisseur: 1.0mm
        </div>
    </div>

    <!-- Controls -->
    <div class="h-16 px-4 flex items-center bg-gray-900 border-t border-gray-800">
        <span class="text-xs mr-2 opacity-50">Z-Axis</span>
        <input type="range" id="slice-slider" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" min="0" max="100" value="0">
    </div>

    <script src="app.js"></script>
</body>
</html>
