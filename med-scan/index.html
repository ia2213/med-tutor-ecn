<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ECN Tutor - Imageur Médical PRO</title>
    <!-- We add integrity/crossorigin where applicable. Telegram SDK doesn't version its main tag statically, so SRI isn't strictly robust but it's ok. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--tg-theme-bg-color, #0d1117);
            color: var(--tg-theme-text-color, #c9d1d9);
            overflow: hidden; touch-action: none; font-family: -apple-system, sans-serif;
        }
        select, button { outline: none; }
        
        #app-container {
            display: flex; flex-direction: column; height: 100dvh; width: 100vw;
        }
        
        /* Top Bar */
        #topbar {
            height: 56px; flex-shrink: 0;
            background: #161b22; border-bottom: 1px solid #30363d;
            display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
        }
        #case-select {
            background: #0d1117; color: #fff; border: 1px solid #30363d;
            border-radius: 6px; padding: 6px 10px; font-size: 14px; max-width: 65%;
        }
        #specialty-badge {
            background: #1f6feb; color: #fff; font-size: 11px; font-weight: bold;
            padding: 4px 8px; border-radius: 12px;
        }

        /* Center Viewer */
        #viewer-area {
            flex: 1; position: relative; background: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #med-image {
            max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none;
            transition: filter 0.2s ease;
        }
        
        /* HUD */
        #hud {
            position: absolute; bottom: 10px; left: 10px; pointer-events: none;
            color: #58a6ff; font-family: monospace; font-size: 13px; text-shadow: 1px 1px 0 #000;
        }
        
        /* Loading Overlay */
        #loading-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .progress-bar-wrap { width: 60%; height: 8px; background: #30363d; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: #58a6ff; transition: width 0.1s; }

        /* Guide Panel */
        #guide-panel {
            background: #161b22; border-top: 1px solid #30363d; max-height: 40vh;
            display: flex; flex-direction: column; z-index: 20;
        }
        #guide-header {
            padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between;
            font-size: 14px; border-bottom: 1px solid #30363d; align-items: center; cursor: pointer;
        }
        #guide-content { padding: 15px; overflow-y: auto; font-size: 13px; line-height: 1.5; display: none; }
        #guide-content.open { display: block; }
        
        /* Controls Bottom */
        #controls-bar {
            height: 50px; background: #161b22; display: flex; align-items: center; padding: 0 15px; flex-shrink: 0; gap: 10px; border-top: 1px solid #30363d;
        }
        #slice-slider { flex: 1; accent-color: #58a6ff; }
        .win-toggle { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;}
        .win-toggle.active { background: #1f6feb; border-color: #1f6feb; color: #fff;}

        /* Quiz Modal */
        #quiz-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;
            display: none; padding: 20px; flex-direction: column; overflow-y: auto;
        }
        .quiz-option {
            background: #21262d; border: 1px solid #30363d; padding: 12px; border-radius: 8px; margin-bottom: 8px;
            cursor: pointer; color: #c9d1d9; transition: all 0.2s;
        }
        .quiz-option.correct { background: #238636; border-color: #2ea043; color: #fff; }
        .quiz-option.wrong { background: #da3633; border-color: #ff7b72; color: #fff; }
        .quiz-exp { margin-top: 10px; padding: 10px; background: #1f6feb20; border-left: 3px solid #1f6feb; font-size: 13px; display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- TOP BAR -->
    <div id="topbar">
        <select id="case-select">
            <option value="neuro_mri_reel">IRM Cerveau (SEP)</option>
            <option value="scanner_crane_reel">Scanner Crânien (Neuro)</option>
            <option value="radio_rachis_reel">Radio Rachis (Ortho)</option>
        </select>
        <div id="specialty-badge">Chargement...</div>
    </div>

    <!-- VIEWER -->
    <div id="viewer-area">
        <div id="loading-overlay">
            <div id="loading-text" class="text-sm font-bold text-white mb-2">Chargement des coupes...</div>
            <div class="progress-bar-wrap"><div id="progress-bar"></div></div>
        </div>
        <img id="med-image" src="" alt="Scan" style="display:none;" />
        <div id="hud">Coupe 0/0</div>
    </div>

    <!-- CONTROLS -->
    <div id="controls-bar">
        <input type="range" id="slice-slider" min="0" max="100" value="0">
        <button id="btn-fenetre" class="win-toggle">Fenêtre</button>
    </div>

    <!-- GUIDE ANATOMIQUE -->
    <div id="guide-panel">
        <div id="guide-header">
            <span>📚 Guide Anatomique & Sémiologie</span>
            <span id="guide-chevron">▲</span>
        </div>
        <div id="guide-content" class="open">
            <div id="guide-text" class="mb-4 text-gray-300"></div>
            <button id="btn-start-quiz" class="w-full bg-[#238636] hover:bg-[#2ea043] text-white font-bold py-2 px-4 rounded">🔍 Vérifier ma lecture (Quiz)</button>
        </div>
    </div>
</div>

<!-- QUIZ MODAL -->
<div id="quiz-modal">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-white">Quiz Clinique</h2>
        <button id="btn-close-quiz" class="text-gray-400 text-2xl">&times;</button>
    </div>
    <div id="quiz-container" class="space-y-6"></div>
</div>

<script src="app.js"></script>
</body>
</html>
